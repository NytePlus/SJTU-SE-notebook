name: Build PDFs for Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Markdown files
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix="$(
            find . \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name '*.md' \
              -print0 |
            sort -z |
            python3 -c '
          import json, os, sys

          files = [
              p.decode()
              for p in sys.stdin.buffer.read().split(b"\0")
              if p
          ]

          items = []

          for path in files:
              path = path.removeprefix("./")

              folder = os.path.dirname(path)
              filename = os.path.basename(path)
              stem = os.path.splitext(filename)[0]
              folder_name = os.path.basename(folder)

              if stem == folder_name:
                  output = f"{folder_name}.pdf"
              else:
                  output = f"{folder_name}-{stem}.pdf"

              items.append({
                  "input": path,
                  "folder": folder,
                  "filename": filename,
                  "output": output
              })

          print(json.dumps({"include": items}))
          '
          )"

          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p release-pdfs

      - name: Convert Markdown to PDF with Pandoc
        uses: docker://pandoc/latex:latest
        with:
          args: >-
            ${{ matrix.input }}
            --from=gfm
            --pdf-engine=xelatex
            -V geometry:margin=1in
            -o release-pdfs/${{ matrix.output }}

      - name: Upload PDF to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/${{ matrix.output }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
