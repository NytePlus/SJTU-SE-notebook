name: Build PDFs for Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Install Typst
        uses: typst-community/setup-typst@v4
    
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            fonts-noto-cjk
    
          pandoc --version
          typst --version

      - name: Generate one PDF per Markdown file
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/release-pdfs"
          mkdir -p "$output_dir"

          generated_count=0

          for folder_path in "$GITHUB_WORKSPACE"/*/; do
            folder_name="$(basename "$folder_path")"

            # Skip generated output directory
            if [ "$folder_name" = "release-pdfs" ]; then
              continue
            fi

            # Only process markdown files directly under each folder
            mapfile -t md_files < <(
              find "$folder_path" \
                -maxdepth 1 \
                -type f \
                -name '*.md' \
                | sort
            )

            if [ "${#md_files[@]}" -eq 0 ]; then
              echo "Skip ${folder_name}: no markdown files."
              continue
            fi

            for md_file in "${md_files[@]}"; do
              md_dir="$(dirname "$md_file")"
              md_name="$(basename "$md_file" .md)"

              # Avoid name collision
              if [ "$md_name" = "$folder_name" ]; then
                output_pdf="$output_dir/${folder_name}.pdf"
              else
                output_pdf="$output_dir/${folder_name}-${md_name}.pdf"
              fi

              echo "Building:"
              echo "  Input : $md_file"
              echo "  Output: $output_pdf"

              (
                cd "$md_dir"

                pandoc "$(basename "$md_file")" \
                  --from=gfm \
                  --pdf-engine=typst \
                  --resource-path="$md_dir" \
                  -o "$output_pdf"
              )

              generated_count=$((generated_count + 1))
            done
          done

          if [ "$generated_count" -eq 0 ]; then
            echo "::error::No PDFs generated."
            exit 1
          fi

          echo "Generated ${generated_count} PDFs."

      - name: Upload PDFs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/*.pdf
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
