name: Build PDFs for Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build PDFs with Chinese support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pdfs

          # Use one container for every document and install the CJK font plus
          # deep-list support once before conversion.
          docker run --rm -i \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/data" \
            --workdir /data \
            --entrypoint /bin/sh \
            pandoc/latex:3.8 -s <<'CONTAINER_SCRIPT'
          set -eu

          apk add --no-cache font-noto-cjk texmf-dist-latexextra
          export TEXINPUTS='/usr/share/texmf-dist/tex/latex//:'

          cat > /tmp/deep-lists.tex <<'LATEX_HEADER'
          \usepackage{enumitem}
          \setlistdepth{20}
          \renewlist{itemize}{itemize}{20}
          \renewlist{enumerate}{enumerate}{20}
          \setlist[itemize]{label=\textbullet}
          \setlist[enumerate]{label=\arabic*.}
          LATEX_HEADER

          find . \
            -type f \
            -name '*.md' \
            ! -path './.git/*' \
            ! -path './release-pdfs/*' \
            -print | LC_ALL=C sort > /tmp/markdown-files

          total="$(wc -l < /tmp/markdown-files | tr -d ' ')"
          if [ "$total" -eq 0 ]; then
            echo 'No Markdown files found.' >&2
            exit 1
          fi

          success=0
          failed=0

          while IFS= read -r markdown; do
            relative="${markdown#./}"
            stem="${relative%.md}"
            output="$(printf '%s' "$stem" | sed 's|/|__|g').pdf"
            markdown_dir="$(dirname "$markdown")"
            markdown_name="$(basename "$markdown")"

            echo "Building $relative -> release-pdfs/$output"

            if (
              cd "$markdown_dir"
              pandoc "$markdown_name" \
                --from=gfm \
                --pdf-engine=xelatex \
                --resource-path=".:/data" \
                --include-in-header=/tmp/deep-lists.tex \
                -V mainfont='Noto Serif CJK SC' \
                -V sansfont='Noto Sans CJK SC' \
                -V monofont='Noto Sans Mono CJK SC' \
                -V geometry:margin=1in \
                -o "/data/release-pdfs/$output"
            ); then
              success=$((success + 1))
            else
              echo "::error file=$relative::PDF conversion failed"
              failed=$((failed + 1))
            fi
          done < /tmp/markdown-files

          echo "Generated $success of $total PDFs."
          if [ "$failed" -ne 0 ]; then
            echo "$failed PDF conversion(s) failed." >&2
            exit 1
          fi
          CONTAINER_SCRIPT

      - name: Upload PDFs to current Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/*.pdf
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
