name: Build PDFs for Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build PDFs with Chinese support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pdfs

          # Use one container for every document and install the CJK font plus
          # deep-list support once before conversion.
          docker run --rm -i \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/data" \
            --workdir /data \
            --entrypoint /bin/sh \
            pandoc/latex:3.8 -s <<'CONTAINER_SCRIPT'
          set -eu

          apk add --no-cache font-noto-cjk texmf-dist-latexextra
          export TEXINPUTS='/usr/share/texmf-dist/tex/latex//:'

          cat > /tmp/deep-lists.tex <<'LATEX_HEADER'
          \usepackage{enumitem}
          \setlistdepth{20}
          \renewlist{itemize}{itemize}{20}
          \renewlist{enumerate}{enumerate}{20}
          \setlist[itemize]{label=\textbullet}
          \setlist[enumerate]{label=\arabic*.}
          LATEX_HEADER

          expected=0
          failed=0
          batch_size=0
          batch_pids=''

          wait_for_batch() {
            for job_pid in $batch_pids; do
              if ! wait "$job_pid"; then
                failed=$((failed + 1))
              fi
            done
            batch_size=0
            batch_pids=''
          }

          for course_dir in ./*/; do
            find "$course_dir" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              -name '*.md' \
              -print | LC_ALL=C sort > /tmp/course-markdown-files

            if [ ! -s /tmp/course-markdown-files ]; then
              continue
            fi

            course="$(basename "${course_dir%/}")"
            output="$course.pdf"
            set --
            while IFS= read -r markdown; do
              set -- "$@" "$(basename "$markdown")"
            done < /tmp/course-markdown-files

            echo "Building $course -> release-pdfs/$output"
            printf '  %s\n' "$@"

            (
              cd "$course_dir"
              pandoc "$@" \
                --from=gfm \
                --pdf-engine=xelatex \
                --resource-path=".:/data" \
                --include-in-header=/tmp/deep-lists.tex \
                -V mainfont='Noto Serif CJK SC' \
                -V sansfont='Noto Sans CJK SC' \
                -V monofont='Noto Sans Mono CJK SC' \
                -V geometry:margin=1in \
                -o "/data/release-pdfs/$output"
            ) || {
              echo "::error file=$course::PDF conversion failed"
              exit 1
            } &

            batch_pids="$batch_pids $!"
            batch_size=$((batch_size + 1))
            expected=$((expected + 1))

            if [ "$batch_size" -eq 3 ]; then
              wait_for_batch
            fi
          done

          wait_for_batch

          generated="$(find /data/release-pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')"
          echo "Generated $generated of $expected course PDFs."
          if [ "$expected" -eq 0 ]; then
            echo 'No course PDFs were generated.' >&2
            exit 1
          fi
          if [ "$failed" -ne 0 ] || [ "$generated" -ne "$expected" ]; then
            echo "$failed PDF conversion(s) failed." >&2
            exit 1
          fi
          CONTAINER_SCRIPT

      - name: Upload PDFs to current Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/*.pdf
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
