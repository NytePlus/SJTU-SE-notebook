name: Build PDFs for Release

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: write


jobs:
  build-pdf:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install fonts on host
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk


      - name: Build PDFs
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p release-pdfs

          failed=0
          success=0


          while IFS= read -r -d '' md; do


            dir=$(dirname "$md")

            name=$(basename "$md" .md)

            folder=$(basename "$dir")


            output="release-pdfs/${folder}-${name}.pdf"


            echo "=============================="
            echo "Input : $md"
            echo "Output: $output"
            echo "=============================="


            if docker run --rm \
              -v "$PWD:/data" \
              -v "/usr/share/fonts:/usr/share/fonts:ro" \
              -v "/etc/fonts:/etc/fonts:ro" \
              -w /data \
              pandoc/latex:latest \
              "$md" \
              --from=gfm \
              --pdf-engine=xelatex \
              --resource-path="$dir" \
              -V geometry:margin=1in \
              -V CJKmainfont="Noto Serif CJK SC" \
              -o "$output"

            then

              success=$((success+1))

            else

              echo "FAILED: $md"
              failed=$((failed+1))

            fi


          done < <(
            find . \
            -type f \
            -name "*.md" \
            ! -path "./.git/*" \
            ! -path "./release-pdfs/*" \
            -print0
          )


          echo "success=$success"
          echo "failed=$failed"


          if [ "$success" -eq 0 ]; then
            exit 1
          fi


          if [ "$failed" -ne 0 ]; then
            exit 1
          fi



      - name: Upload Release PDFs
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2

        with:
          files: release-pdfs/*.pdf

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
