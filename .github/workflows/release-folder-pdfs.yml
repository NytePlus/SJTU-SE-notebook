name: Build PDFs for Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk
          google-chrome --version

      - name: Generate one PDF per Markdown file
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/release-pdfs"
          temp_dir="$RUNNER_TEMP/markdown-html"

          mkdir -p "$output_dir"
          mkdir -p "$temp_dir"

          generated_count=0

          for folder_path in "$GITHUB_WORKSPACE"/*/; do
            folder_name="$(basename "$folder_path")"

            if [ "$folder_name" = "release-pdfs" ]; then
              continue
            fi

            mapfile -t md_files < <(
              find "$folder_path" -maxdepth 1 -type f -name '*.md' | sort
            )

            if [ "${#md_files[@]}" -eq 0 ]; then
              echo "Skip ${folder_name}: no Markdown files found."
              continue
            fi

            for md_file in "${md_files[@]}"; do
              md_name="$(basename "$md_file" .md)"

              # 避免不同目录中存在同名 Markdown 时发生覆盖
              output_pdf="$output_dir/${folder_name}-${md_name}.pdf"
              temp_html="$temp_dir/${folder_name}-${md_name}.html"

              echo "Building:"
              echo "  ${md_file}"
              echo "  -> ${output_pdf}"

              md_dir="$(dirname "$md_file")"

              (
                cd "$md_dir"

                pandoc "$(basename "$md_file")" \
                  --from=gfm \
                  --to=html5 \
                  --standalone \
                  --embed-resources \
                  --metadata pagetitle="$md_name" \
                  -o "$temp_html"
              )

              google-chrome \
                --headless \
                --no-sandbox \
                --disable-gpu \
                --print-to-pdf="$output_pdf" \
                --print-to-pdf-no-header \
                "file://$temp_html"

              generated_count=$((generated_count + 1))
            done
          done

          if [ "$generated_count" -eq 0 ]; then
            echo "::error::No PDFs were generated."
            exit 1
          fi

          echo "Generated ${generated_count} PDF(s)."

      - name: Upload PDFs to current release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/*.pdf
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
