name: Build PDFs for Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Markdown to PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-lang-chinese \
            fonts-noto-cjk

      - name: Generate one PDF per top-level folder
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/release-pdfs"
          mkdir -p "$output_dir"

          generated_count=0
          failure_count=0

          for folder_path in "$GITHUB_WORKSPACE"/*/; do
            folder_name="$(basename "$folder_path")"

            mapfile -t md_files < <(
              find "$folder_path" -maxdepth 1 -type f -name '*.md' | sort
            )

            if [ "${#md_files[@]}" -eq 0 ]; then
              echo "Skip ${folder_name}: no Markdown files found."
              continue
            fi

            output_pdf="${output_dir}/${folder_name}.pdf"

            echo "Building ${folder_name}.pdf from:"
            printf '  %s\n' "${md_files[@]}"

            if pandoc "${md_files[@]}" \
              --from=gfm+rebase_relative_paths \
              --pdf-engine=xelatex \
              --resource-path="$GITHUB_WORKSPACE" \
              -V mainfont="Noto Serif CJK SC" \
              -V CJKmainfont="Noto Serif CJK SC" \
              -V geometry:margin=1in \
              -o "$output_pdf"; then

              echo "Generated ${output_pdf}"
              generated_count=$((generated_count + 1))
            else
              echo "::error::Failed to generate PDF for ${folder_name}"
              failure_count=$((failure_count + 1))
            fi
          done

          echo "generated_count=${generated_count}" >> "$GITHUB_OUTPUT"

          if [ "$generated_count" -eq 0 ]; then
            echo "::error::No PDFs were generated."
            exit 1
          fi

          if [ "$failure_count" -gt 0 ]; then
            echo "::error::${failure_count} folder(s) failed conversion."
            exit 1
          fi

      - name: Upload PDFs to current release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/*.pdf
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
