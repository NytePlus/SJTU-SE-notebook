name: Build PDFs for Release

on:
  release:
    types:
      - published

  # 手动调试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Prepare directories
        shell: bash
        run: |
          mkdir -p release-pdfs


      - name: Generate PDFs with Pandoc
        shell: bash
        run: |
          set -euo pipefail

          generated=0
          failed=0

          while IFS= read -r -d '' md_file; do

            md_dir="$(dirname "$md_file")"

            filename="$(basename "$md_file" .md)"
            folder="$(basename "$md_dir")"

            output_name="${folder}-${filename}.pdf"

            # 清理非法文件名字符
            output_name=$(echo "$output_name" | sed 's/[\/\\:*?"<>|]/_/g')

            output="release-pdfs/$output_name"

            echo "================================"
            echo "Building:"
            echo "Input : $md_file"
            echo "Output: $output"
            echo "================================"


            if docker run --rm \
              -v "$PWD:/data" \
              -w /data \
              pandoc/latex:latest \
              "$md_file" \
              --from=gfm \
              --pdf-engine=xelatex \
              --resource-path="$md_dir" \
              -V geometry:margin=1in \
              -V CJKmainfont="Noto Serif CJK SC" \
              -V mainfont="Noto Serif CJK SC" \
              -o "$output"
            then
              echo "Success: $output"
              generated=$((generated+1))
            else
              echo "Failed: $md_file"
              failed=$((failed+1))
            fi

          done < <(
            find . \
              -type f \
              -name "*.md" \
              ! -path "./.git/*" \
              ! -path "./release-pdfs/*" \
              -print0
          )


          echo "Generated PDFs: $generated"
          echo "Failed PDFs: $failed"


          if [ "$generated" -eq 0 ]; then
            echo "::error::No PDFs generated"
            exit 1
          fi


          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed PDF(s) failed"
            exit 1
          fi



      - name: Upload PDFs to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-pdfs/*.pdf
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
